<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MiniLab">
  <title>MiniLab</title>
  <defs>
    <linearGradient id="ml-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- rounded-square background -->
  <rect x="31" y="31" width="450" height="450" rx="112" fill="url(#ml-bg)"/>
  <!-- beaker (white) -->
  <path d="M154 113 H358 V348 Q358 369 337 369 H175 Q154 369 154 348 Z" fill="#ffffff"/>
  <!-- liquid (light cyan) -->
  <path d="M166 266 H346 V341 Q346 362 325 362 H187 Q166 362 166 341 Z" fill="#38BDF8"/>
  <!-- liquid surface line -->
  <rect x="162" y="258" width="188" height="9" rx="4" fill="#ffffff"/>
  <!-- bubbles -->
  <circle cx="215" cy="230" r="11" fill="#ffffff"/>
  <circle cx="256" cy="200" r="8" fill="#ffffff"/>
  <circle cx="297" cy="230" r="9" fill="#ffffff"/>
</svg>
